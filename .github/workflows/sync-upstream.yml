name: Sync upstream weekly

# Every Monday 03:17 UTC, merge new commits from the upstream repo
# (xiaoyang111222/cn-math-taxonomy) into this fork's main.
# Pushing the merged main triggers Cloudflare Pages to redeploy automatically.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream main
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/xiaoyang111222/cn-math-taxonomy.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date with upstream."
            exit 0
          fi
          if ! git merge --no-commit --no-ff upstream/main; then
            # Conflicts confined to .github/workflows/ are expected: this
            # fork drops upstream's workflow files (GITHUB_TOKEN cannot
            # push them), so an upstream edit to a dropped file clashes
            # with its absence here (modify/delete). Resolve each such
            # path in this fork's favour and continue; any other
            # conflict still stops the sync for a manual fix.
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ -z "$conflicts" ] || [ -n "$(printf '%s\n' "$conflicts" | grep -v '^\.github/workflows/')" ]; then
              git merge --abort || true
              echo "::error::Merge conflict with upstream — manual sync needed."
              exit 1
            fi
            printf '%s\n' "$conflicts" | while IFS= read -r path; do
              if git cat-file -e "HEAD:$path" 2>/dev/null; then
                git checkout HEAD -- "$path"
              else
                git rm -f -- "$path"
              fi
            done
          fi
          # GITHUB_TOKEN is refused when a push creates or updates files under
          # .github/workflows/, so keep this fork's own workflow files and drop
          # any workflow changes arriving from upstream before committing.
          git restore --source=HEAD --staged --worktree -- .github/workflows/ || true
          git add -A .github/workflows/
          git commit --no-edit
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Validate before pushing
        if: steps.merge.outputs.changed == 'true'
        run: python3 scripts/validate.py

      - name: Push (triggers Cloudflare Pages deploy)
        if: steps.merge.outputs.changed == 'true'
        run: git push origin main
